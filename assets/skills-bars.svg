<svg viewBox="0 0 780 360" xmlns="http://www.w3.org/2000/svg" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace">
  <defs>
    <linearGradient id="fillGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6ee7ff"/>
      <stop offset="100%" stop-color="#b389f0"/>
    </linearGradient>
    <filter id="soft3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    .frame{ fill:#0b0e14; stroke:#232a38; stroke-width:1.5; }
    .bar{ fill:#10141c; }
    .divider{ stroke:#1a2029; stroke-width:1; }
    .dotr{ fill:#ff5f56; } .dota{ fill:#ffbd2e; } .dotg{ fill:#27c93f; }
    .title{ fill:#4a5262; font-size:12px; }
    .lab{ fill:#d7dde6; font-size:14px; font-weight:600; }
    .pct{ fill:#6f7889; font-size:13px; }
    .track{ fill:#161c27; stroke:#1a2029; stroke-width:1; }
    .fill{ fill:url(#fillGrad); transform-origin:30px 0px; animation: grow 9s ease-in-out infinite; }
    .d0{ animation-delay:0s; } .d1{ animation-delay:0.15s; } .d2{ animation-delay:0.3s; }
    .d3{ animation-delay:0.45s; } .d4{ animation-delay:0.6s; } .d5{ animation-delay:0.75s; }
    @keyframes grow{
      0%,4%   { transform:scaleX(0); }
      30%,78% { transform:scaleX(1); }
      92%,100%{ transform:scaleX(0); }
    }
  </style>

  <rect class="frame" x="1" y="1" width="778" height="358" rx="14" filter="url(#soft3)"/>
  <rect class="bar" x="1.5" y="1.5" width="777" height="38" rx="12"/>
  <line class="divider" x1="0" y1="40" x2="780" y2="40"/>
  <circle class="dotr" cx="28" cy="20" r="6"/>
  <circle class="dota" cx="48" cy="20" r="6"/>
  <circle class="dotg" cx="68" cy="20" r="6"/>
  <text class="title" x="390" y="24" text-anchor="middle">adan@profile — skills.config</text>

  <!-- Row 1: DSA & Algorithms 92% -->
  <text class="lab" x="30" y="74">Data Structures &amp; Algorithms</text>
  <text class="pct" x="750" y="74" text-anchor="end">92%</text>
  <rect class="track" x="30" y="84" width="720" height="10" rx="5"/>
  <rect class="fill d0" x="30" y="84" width="662.4" height="10" rx="5"/>

  <!-- Row 2: Java 85% -->
  <text class="lab" x="30" y="122">Java</text>
  <text class="pct" x="750" y="122" text-anchor="end">85%</text>
  <rect class="track" x="30" y="132" width="720" height="10" rx="5"/>
  <rect class="fill d1" x="30" y="132" width="612" height="10" rx="5"/>

  <!-- Row 3: Python 80% -->
  <text class="lab" x="30" y="170">Python</text>
  <text class="pct" x="750" y="170" text-anchor="end">80%</text>
  <rect class="track" x="30" y="180" width="720" height="10" rx="5"/>
  <rect class="fill d2" x="30" y="180" width="576" height="10" rx="5"/>

  <!-- Row 4: JavaScript / React 78% -->
  <text class="lab" x="30" y="218">JavaScript / React</text>
  <text class="pct" x="750" y="218" text-anchor="end">78%</text>
  <rect class="track" x="30" y="228" width="720" height="10" rx="5"/>
  <rect class="fill d3" x="30" y="228" width="561.6" height="10" rx="5"/>

  <!-- Row 5: SQL / MySQL 75% -->
  <text class="lab" x="30" y="266">SQL / MySQL</text>
  <text class="pct" x="750" y="266" text-anchor="end">75%</text>
  <rect class="track" x="30" y="276" width="720" height="10" rx="5"/>
  <rect class="fill d4" x="30" y="276" width="540" height="10" rx="5"/>

  <!-- Row 6: Node.js / TypeScript 55% -->
  <text class="lab" x="30" y="314">Node.js / TypeScript</text>
  <text class="pct" x="750" y="314" text-anchor="end">55%</text>
  <rect class="track" x="30" y="324" width="720" height="10" rx="5"/>
  <rect class="fill d5" x="30" y="324" width="396" height="10" rx="5"/>
</svg>
